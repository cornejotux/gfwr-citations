name: Update gfwr citations
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: citations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "yaml"))'
      - name: Test
        run: |
          Rscript tests/test.R
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Update OpenAlex
        id: openalex
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: Rscript scripts/update_citations.R
      - name: Update author citation page
        run: python3 scripts/update_author_citations.py
      - name: Update GitHub and combine all sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_SEARCH_TOKEN || github.token }}
          OPENALEX_OUTCOME: ${{ steps.openalex.outcome }}
        run: python3 scripts/update_sources.py
      - name: Commit changed outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update gfwr publications and repository evidence'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
